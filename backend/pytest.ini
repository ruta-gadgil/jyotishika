[pytest]
# Only collect the automated suite in tests/. The scripts at the backend
# root (test_auth.py, test_installation.py, example_api_test.py,
# test_db_connection.py, etc.) are manual smoke-test scripts meant to be run
# by hand against a live server/DB and must not be auto-collected by a
# bare `pytest` invocation.
testpaths = tests

# Ensure the backend/ directory (where the `app` package lives) is always
# importable, regardless of cwd or how pytest is invoked (e.g. via the
# `../venv/bin/pytest` console script used by `make test`, which does not
# add cwd to sys.path the way `python -m pytest` does).
pythonpath = .
